# slsv.yml — full reference. Every knob shown. Copy, trim, ship.
# All optional fields have sane defaults; minimal slsv.yml = just `app:` + one resource.
#
# Stages: `slsv deploy --stage prod` namespaces every resource as <app>-<stage>-<name>,
# so dev/prod coexist. Per-stage secrets load from `.env.<stage>` (falls back to `.env`).
# Default stage is `dev`. No per-stage yml block — same shape, different secrets/values.

app: my-app

functions:
  api:
    runtime: nodejs24
    handler: ./src/api.handler
    http:
      - method: ANY
        path: /api/{proxy+}
      - method: GET
        path: /health
        auth: false                    # public — skip the api.auth authorizer on this one route
    # timeout: 30                      # seconds, 1-900 (default 30)
    # memory: 256                      # MB, 128-10240 (default 256)
    # architecture: arm64              # arm64 (default, cheaper+faster) | x86_64. Immutable after create.
    # ephemeralStorage: 512            # /tmp size MB, 512-10240 (default 512)
    # tracing: true                    # X-Ray active tracing
    # reservedConcurrency: 10          # cap concurrent executions (0 = throttle all)
    # provisionedConcurrency: 2        # warm instances, no cold start (--target aws only).
    # Publishes a version + `live` alias; costs $ 24/7.
    # environment:                     # custom env vars (slsv bindings always win)
    #   LOG_LEVEL: debug

  worker:
    runtime: nodejs24
    handler: ./src/worker.handler
    queue: { name: jobs } # SQS trigger — Lambda invoked per message
    #   queue: { name: jobs, maxConcurrency: 5 }  # cap parallel Lambda pollers (2-1000). Per-mapping,
    #                                              # doesn't consume the account's reserved-concurrency pool.

  cron:
    runtime: nodejs24
    handler: ./src/cron.handler
    cron: { schedule: "0 8 * * *" } # EventBridge — 5-field unix cron OR rate()

  onOrder:
    runtime: nodejs24
    handler: ./src/on-order.handler
    event: # EventBridge event-pattern — invoked when a matching event hits the default bus
      #      producers publish with `emit('order.placed', {...})` from @slsv/sdk (source
      #      defaults to the producer's app name — works across separate slsv apps)
      pattern:
        source: ["orders"]
        detail-type: ["order.placed"]

  makeThumbnail:
    runtime: nodejs24
    handler: ./src/thumb.handler
    bucket: # S3 event trigger — invoked when an object lands in (or leaves) the bucket
      name: uploads # must be declared under buckets: below
      events: [created] # created | removed (default [created])
      prefix: raw/ # optional key filter — also the guard against write-back loops
      suffix: .jpg #   (a fn writing results into the SAME bucket it listens on)
    # or an array — multiple buckets (or several filter blocks) into ONE fn; the handler
    # tells sources apart via event.Records[0].s3.bucket.name:
    # bucket:
    #   - { name: uploads, suffix: .jpg }
    #   - { name: imports }

  authorizer:                          # a normal fn with NO trigger — referenced by `api.auth` below.
    runtime: nodejs24                  #   API Gateway invokes it before every protected route.
    handler: ./src/auth.handler        #   Return { isAuthorized: bool, context? } — deny → 403.

api: # optional — HTTP API Gateway settings
  # CORS for the API. Omit this whole block → '*' (open; required when the S3-hosted frontend
  # is a different origin). Two shapes:
  #   (a) array of origins — locks AllowOrigins, methods/headers stay '*':
  cors:
    - https://myapp.com
    - https://www.myapp.com
  #   (b) object — full control. Use `credentials: true` if the browser sends cookies / an
  #       Authorization credential via `fetch(url, { credentials: 'include' })`. Credentials
  #       CANNOT combine with '*' (browsers reject it), so origins must be explicit and
  #       methods/headers default to concrete lists (override below if you need more):
  # cors:
  #   origins: ["https://myapp.com"]   # optional — omit to declare shared cors in the base and
  #                                    #   add per-stage origins under stages.<name>.api.cors.
  #                                    #   With credentials, missing/`*` origins error on deploy
  #                                    #   (--target aws); ignored on `slsv dev` (Floci owns CORS).
  #   credentials: true
  #   methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]   # optional
  #   headers: ["content-type", "authorization"]                     # optional
  #   exposeHeaders: ["content-disposition"]                         # optional (response headers JS may read)
  # Custom domain for the API (aws-only). slsv does EVERYTHING: ACM cert (DNS-validated),
  # regional API Gateway custom domain, API mapping, and the public DNS record. Zero manual DNS.
  # You supply exactly two things:
  #   1. domain below — the hostname you want.
  #   2. a Cloudflare API token in .env  →  CLOUDFLARE_API_TOKEN=...
  #      (dash.cloudflare.com → My Profile → API Tokens; permission: Zone.DNS Edit). It's a
  #      secret, so it lives in .env, never in this file.
  # slsv finds the Cloudflare zone that owns the domain on its own — no zone/id to look up.
  # DNS provider is Cloudflare only for now (Route53 support is planned).
  domain: api.myapp.com
  # certArn: arn:aws:acm:...:certificate/xxx   # rare — reuse an existing ACM cert instead of
  #                                            #        slsv minting one (e.g. a wildcard)
  # basePath: myapp   # mount THIS app under a path on `domain` so multiple separate slsv apps can
  #                   # share one domain — api.myapp.com/myapp/... , another app on /auth, etc.
  #                   # API Gateway strips the base path, so routes stay /v1/{proxy+}. Omit for a
  #                   # single-app domain (mapping at the root). Must not be empty. Destroying one
  #                   # app removes only its mapping; the domain + cert are torn down by the LAST
  #                   # app out.
  # Lambda authorizer — protect the API with your own auth. When set, EVERY http route is
  # guarded (opt one out with `auth: false` on the route, e.g. /health above). `function` names
  # the trigger-less fn above that API Gateway invokes first; it returns
  # { isAuthorized: bool, context? } — the lookup (DB / secret / JWT / …) is entirely yours.
  auth:
    function: authorizer
    # identitySource: ["$request.header.Authorization"]  # optional — what API GW reads + caches on
    # ttl: 300                                           # optional — cache allow/deny (s); 0 = every request

queues:
  jobs:
    type: sqs
    # fifo: true                       # FIFO ordering + dedup (suffix .fifo auto-added)
    # visibilityTimeout: 60            # seconds (default 30, max 43200)
    # dlq: true                        # auto-provision `<name>Failed` (matches `fifo`); or name
                                      #   a custom queue: `dlq: myDlq`. Either way slsv creates
                                      #   it — no separate `queues:` entry needed.
                                      #   `dlq: false` (or omit) = no DLQ; useful as a stage
                                      #   overlay to disable a base-stage DLQ.
    # maxReceiveCount: 5               # deliveries before a msg routes to the DLQ (default 5).
                                      #   No-op without `dlq:` — ignored unless a DLQ is set.

  # jobsFailed: { type: sqs }         # only needed to TUNE a DLQ (e.g. visibilityTimeout);
                                      #   otherwise `dlq: true` above creates it for you.

  # ordered:
  #   type: sqs
  #   fifo: true

buckets:
  private: {} # only Lambda reads/writes
  uploads: {} # target of the makeThumbnail bucket trigger above
  # public:                                     # browser reads objects via the bucket URL
  #   publicRead: true                          # → s3:GetObject policy + access blocks off
  # uploads:                                    # browser uploads via presigned PUT
  #   cors: ['https://app.example.com']         # → PutBucketCors for the listed origins

databases:
  # dynamodb — NoSQL table; access with db('orders') → DATABASE_ORDERS
  orders:
    type: dynamodb
    partitionKey: { name: id, type: S } # S | N | B
    sortKey: { name: createdAt, type: S } # optional
    gsi: # optional (dynamodb only)
      - name: byUser
        partitionKey: { name: userId, type: S }
        sortKey: { name: createdAt, type: S }

  # postgres / mysql — SQL instance via RDS API; access with db('primary') → DATABASE_PRIMARY
  primary:
    type: postgres
    # name: primary                    # actual DB name; defaults to logical key
    # init_sql: ./schema.sql           # path to SQL, runs once on first creation
    # instanceClass: db.t3.micro       # RDS class (--target aws only; default db.t3.micro)
    # storage: 20                      # GB (--target aws only; default 20, max 65536)
    # multiAz: false                   # (--target aws only)
    # skipFinalSnapshot: true          # destroy takes NO final snapshot (default true).
    # false → destroy saves a timestamped snapshot first.

  # replica:
  #   type: mysql
  #   instanceClass: db.t4g.small

  # ── Hosted Postgres (Supabase / Neon / RDS you manage yourself) ──
  # slsv only provisions dynamodb/postgres/mysql. For a DB you host elsewhere, don't put it
  # here — put the connection string in `secrets:` (it's a password) and connect with your
  # own driver (pg / Prisma / Drizzle / postgres.js):
  #
  #   secrets: [DATABASE_URL]                 # handler: const url = await secret('DATABASE_URL')
  #
  # .env:      DATABASE_URL=postgresql://postgres.xxxx:PW@aws-0-region.pooler.supabase.com:6543/postgres
  # Use Supabase's TRANSACTION POOLER (port 6543), not direct :5432 — Lambda opens many
  # short connections and would exhaust the direct limit. Per-stage: .env.prod = prod project.

caches:
  session:
    type: valkey # `type: redis` is an alias — same backend
    # nodeType: cache.t4g.micro        # ElastiCache node type (--target aws only; default t4g.micro)
    # nodes: 1                         # NumCacheNodes (--target aws only; 1-5)

  # big:
  #   type: valkey
  #   nodeType: cache.r6g.large
  #   nodes: 3

workers:
  # Container jobs, for work a Lambda can't do: longer than 15 min, heavier than 10 GB, or
  # needing a real OS toolchain (ffmpeg, torch, ImageMagick). One Fargate task runs per call —
  # there's no pool, no idle timeout, and nothing billing between jobs.
  #
  # No trigger block: you start it from handler code.
  #   import { worker } from '@slsv/sdk'
  #   const { jobId } = await worker('clipper').run({ videoId })   # returns at once
  # The payload arrives in the container as $SLSV_PAYLOAD (JSON). ECS caps overrides near 8 KB,
  # so pass an id and let the worker fetch the rest — it gets the same BUCKET_*/DATABASE_*/
  # QUEUE_*/SECRET_* bindings a function does.
  #
  # Nothing retries a failed task and nothing reports it finishing: track state yourself (a
  # `jobs` row set to done by the worker) and poll it. Add a queue in front if you need retry.
  clipper:
    image: ./worker # folder with a Dockerfile (built + pushed to ECR on deploy)
    # cpu: 1024                     # Fargate CPU units, 1024 = 1 vCPU. 256|512|1024|2048|4096|8192|16384
    # memory: 2048                  # MB — Fargate allows only a fixed grid per cpu (1024 → 2048-8192
    #                               # in 1024 steps). Default = that row's minimum. Floci accepts any
    #                               # pair, so an invalid one only fails on --target aws.
    # ephemeralStorage: 100         # GB of /tmp-style disk, 21-200. Default 20 — thin for video.
    # architecture: arm64           # arm64 (default) | x86_64. Must match what your Dockerfile can
    #                               # build; slsv passes --platform so a Mac can't ship the wrong one.
    # maxRuntime: 3600              # secs. Fargate has NO task timeout, so slsv injects this as
    #                               # $SLSV_MAX_RUNTIME and the worker must enforce its own deadline.
    # environment: { HF_HOME: /models }  # custom env vars (slsv bindings always win)
    # vpc:                          # Optional. On --target aws slsv uses the account's DEFAULT VPC
    #   subnets: [subnet-abc]       # (public subnets + an egress-only `<app>-<stage>-worker` security
    #   securityGroups: [sg-123]    # group it creates). Set this to override — needed if the default
    #   assignPublicIp: true        # VPC was deleted, or for private subnets (then bring a NAT/VPC
    #                               # endpoints yourself). Ignored on --target local (Floci has no EC2).

secrets:
  # Names only. Values come from .env.<stage> (falls back to .env) and are stored in AWS
  # Secrets Manager as <app>-<stage>-<NAME>. The VALUE is never put in the function env —
  # fetch it at runtime:  const jwt = await secret('JWT_SECRET')   (from '@slsv/sdk').
  # Per stage: .env = dev, .env.prod = prod, .env.staging = staging.
  - JWT_SECRET
  - WEBHOOK_SECRET

tags:
  # Custom tags applied to EVERY provisioned resource (on top of the automatic
  # slsv:managed-by / slsv:app / slsv:stage tags). Use for cost allocation / ownership.
  Team: payments
  CostCenter: eng-42

# logRetentionDays: 14   # CloudWatch log retention for all functions (default 14; 0 = never
# expire). Must be a CloudWatch value: 1,3,5,7,14,30,60,90,...,3653.

# autoRemove: false   # default false (safe): a data store (DynamoDB/S3/RDS) or secret dropped
# from this yml is REPORTED on the next deploy and left until `slsv destroy`. Set true to DELETE
# such orphans on deploy (with their data — destructive; secrets delete without recovery window).
# Lambda/EventBridge/frontend always prune.
# Run `slsv plan` to preview exactly what a deploy would create/update/delete first.

frontend:
  src: ./frontend/dist # build output to serve
  build: npm --prefix frontend install && npm --prefix frontend run build # build cmd
  # cloudfront: true                  # aws-only. Serves the frontend + /api/* under one
  # HTTPS *.cloudfront.net domain (S3 website endpoints
  # are HTTP-only). Skips the VITE_SLSV_API_URL injection
  # so /api calls stay relative (same-origin). Deploy and
  # destroy each take ~15-20 min (CloudFront propagation).
  # domain: app.myapp.com             # aws-only, default none. Custom frontend domain,
  # provisioned end-to-end like api.domain: us-east-1 ACM
  # cert (DNS-validated), CloudFront alias, public
  # Cloudflare CNAME — needs CLOUDFLARE_API_TOKEN in env.
  # Implies cloudfront: true. Ignored on --target local.
  # certArn: arn:aws:acm:us-east-1:…  # default none. BYO pre-validated us-east-1 cert
  # (e.g. a wildcard) instead of slsv minting one.
  # cacheTtl: 3600                    # secs, default 86400 (CloudFront's 24h). How long edges
  # cache frontend files (S3 origin sends no Cache-Control,
  # so this is the effective TTL). Converged on redeploy.
  # invalidate: true                  # default true. CloudFront invalidation (/*) after each
  # deploy so the new build serves immediately; false =
  # wait out cacheTtl instead. /* counts as one path
  # (first 1000/month free).

# ── Per-stage overrides (optional) ──────────────────────────────────────────
# `stages.<name>` deep-merges over the base above for `--stage <name>`. Override ONLY
# what differs; everything else is inherited. Objects merge, scalars/arrays replace,
# and `key: null` REMOVES a base key (used below to swap a trigger). Keep blocks small —
# dev/prod parity is the goal; overlays are for controlled differences, not a fork.
#
# stages:
#   prod:
#     functions:
#       worker:
#         timeout: 300               # prod worker needs longer; dev keeps its default
#     frontend:
#       cloudfront: true             # CDN only in prod
#
#   dev:
#     functions:
#       worker:
#         queue: null                # drop the SQS trigger in dev...
#         event:                     # ...and experiment with EventBridge instead
#           pattern:
#             source: ['orders']
